name: Portable Core Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  portable-core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Validate portable shell wrappers
        shell: bash
        run: |
          sh -n ./scripts/install.sh
          sh -n ./scripts/upgrade.sh
          sh -n ./scripts/validate-layout.sh
          sh -n ./shared-mcp/start-default-shared-mcp.sh
          sh -n ./shared-mcp/start-shared-mcp.sh
          sh -n ./shared-mcp/status-shared-mcp.sh
          sh -n ./shared-mcp/stop-shared-mcp.sh

      - name: Seed portable smoke vault
        shell: pwsh
        env:
          AI_MEMORY_STORE: ${{ runner.temp }}/vault-smoke/00-System/ai-memory
        run: |
          $vault = $env:RUNNER_TEMP
          $vaultRoot = Join-Path $vault 'vault-smoke'
          $memRoot = Join-Path $vaultRoot '00-System/ai-memory'
          $paths = @(
            (Join-Path $memRoot 'generated'),
            (Join-Path $memRoot 'structured'),
            (Join-Path $memRoot 'events'),
            (Join-Path $memRoot 'inbox'),
            (Join-Path $memRoot 'state'),
            (Join-Path $memRoot 'embeddings'),
            (Join-Path $vaultRoot '02-KB')
          )
          foreach ($path in $paths) {
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }

          Set-Content -LiteralPath (Join-Path $vaultRoot '02-KB/OBSIDIAN.md') -Encoding UTF8 -Value '# Portable Smoke Vault'
          Set-Content -LiteralPath (Join-Path $vaultRoot '02-KB/MEMORY.md') -Encoding UTF8 -Value '# Durable Memory'
          Set-Content -LiteralPath (Join-Path $vaultRoot '02-KB/WORKING.md') -Encoding UTF8 -Value '# Working Memory'

          @'
          {"schemaVersion":2,"id":"durable-1","t":"2026-04-02T00:00:00.000Z","tool":"codex","type":"workflow-rule","project":"portable-smoke","title":"Shared MCP is the default runtime layer","content":"Shared MCP is the default runtime layer for portable smoke validation.","source":"shared-inbox","scope":"feedback","visibility":"shared","source_kind":"writeback","memory_level":"durable","workspace":"portable-smoke","task_state":"","freshness":"warm","confidence":0.8,"metadata":{}}
          {"schemaVersion":2,"id":"durable-2","t":"2026-04-02T00:10:00.000Z","tool":"claude-code","type":"project-context","project":"portable-smoke","title":"Session memory should stay concise","content":"Session memory should stay concise and handoff-oriented.","source":"shared-inbox","scope":"project","visibility":"shared","source_kind":"writeback","memory_level":"durable","workspace":"portable-smoke","task_state":"","freshness":"warm","confidence":0.8,"metadata":{}}
          '@ | Set-Content -LiteralPath (Join-Path $memRoot 'structured/shared-inbox.jsonl') -Encoding UTF8

          @'
          {"schemaVersion":2,"id":"session-1","t":"2026-04-02T01:00:00.000Z","tool":"claude-code","type":"summary","project":"portable-smoke","title":"Portable session handoff","content":"Portable session handoff notes remain available for the next agent.","source":"session-memory","scope":"summary","visibility":"shared","source_kind":"session","memory_level":"session","workspace":"portable-smoke","task_state":"","freshness":"hot","confidence":0.7,"metadata":{}}
          '@ | Set-Content -LiteralPath (Join-Path $memRoot 'structured/session-memory.jsonl') -Encoding UTF8

          @'
          {"schemaVersion":2,"id":"event-1","t":"2026-04-02T02:00:00.000Z","tool":"opencode","type":"summary","project":"portable-smoke","title":"Shared memory smoke event","content":"Portable smoke event confirms the memory bus keeps current context fresh.","source":"shared-events","scope":"summary","visibility":"shared","source_kind":"event","memory_level":"event","workspace":"portable-smoke","task_state":"","freshness":"hot","confidence":0.6,"metadata":{}}
          '@ | Set-Content -LiteralPath (Join-Path $memRoot 'structured/shared-events.jsonl') -Encoding UTF8

          @'
          {"schemaVersion":2,"id":"task-1","t":"2026-04-02T03:00:00.000Z","tool":"openclaw","type":"task-note","project":"portable-smoke","title":"OpenClaw blackboard portable task","content":"OpenClaw blackboard portable task","source":"openclaw-blackboard","scope":"task","visibility":"shared","source_kind":"task","memory_level":"task","workspace":"portable-smoke","task_state":"PROCESSING","freshness":"hot","confidence":0.8,"metadata":{}}
          '@ | Set-Content -LiteralPath (Join-Path $memRoot 'structured/openclaw-blackboard.jsonl') -Encoding UTF8

          @'
          {"schemaVersion":2,"id":"run-1","t":"2026-04-02T03:10:00.000Z","tool":"openclaw","type":"task-note","project":"portable-smoke","title":"OpenClaw run ledger portable record","content":"OpenClaw run ledger portable record","source":"openclaw-runs","scope":"task","visibility":"shared","source_kind":"run","memory_level":"task","workspace":"portable-smoke","task_state":"ok","freshness":"hot","confidence":0.8,"metadata":{}}
          '@ | Set-Content -LiteralPath (Join-Path $memRoot 'structured/openclaw-runs.jsonl') -Encoding UTF8

          @'
          {"schemaVersion":2,"id":"job-1","t":"2026-04-02T03:20:00.000Z","tool":"openclaw","type":"task-note","project":"portable-smoke","title":"OpenClaw cron portable job","content":"OpenClaw cron portable job","source":"openclaw-jobs","scope":"task","visibility":"shared","source_kind":"job","memory_level":"task","workspace":"portable-smoke","task_state":"ok","freshness":"hot","confidence":0.8,"metadata":{}}
          '@ | Set-Content -LiteralPath (Join-Path $memRoot 'structured/openclaw-jobs.jsonl') -Encoding UTF8

      - name: Build memory layers
        shell: pwsh
        env:
          AI_MEMORY_STORE: ${{ runner.temp }}/vault-smoke/00-System/ai-memory
        run: |
          node ./ops/build/build-memory-layers.js | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $env:AI_MEMORY_STORE 'generated/MEMORY-LAYERS.md') -PathType Leaf)) {
            throw 'MEMORY-LAYERS.md was not generated'
          }

      - name: Build handoff pack
        shell: pwsh
        env:
          AI_MEMORY_STORE: ${{ runner.temp }}/vault-smoke/00-System/ai-memory
        run: |
          node ./ops/build/build-handoff-pack.js | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $env:AI_MEMORY_STORE 'generated/HANDOFF.md') -PathType Leaf)) {
            throw 'HANDOFF.md was not generated'
          }

      - name: Run auto dream consolidation
        shell: pwsh
        env:
          AI_MEMORY_STORE: ${{ runner.temp }}/vault-smoke/00-System/ai-memory
          AI_MEMORY_OBSIDIAN_VAULT: ${{ runner.temp }}/vault-smoke
        run: |
          ./ops/run/run-memory-dream.ps1 -Force | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $env:AI_MEMORY_STORE 'generated/AUTO-DREAM.md') -PathType Leaf)) {
            throw 'AUTO-DREAM.md was not generated'
          }

      - name: Validate memory integrity contract
        shell: pwsh
        env:
          AI_MEMORY_STORE: ${{ runner.temp }}/vault-smoke/00-System/ai-memory
        run: |
          node ./ops/check/check-memory-integrity.js --strict --json | Out-Null

      - name: Build embeddings
        if: false  # Requires API keys for embedding generation
        shell: pwsh
        env:
          AI_MEMORY_STORE: ${{ runner.temp }}/vault-smoke/00-System/ai-memory
        run: |
          node ./bus/generate-embeddings.js | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $env:AI_MEMORY_STORE 'embeddings/index.jsonl') -PathType Leaf)) {
            throw 'embeddings index was not generated'
          }

      - name: Run hybrid retrieval smoke
        if: false  # Requires embeddings to be built first
        shell: pwsh
        env:
          AI_MEMORY_STORE: ${{ runner.temp }}/vault-smoke/00-System/ai-memory
        run: |
          $json = node ./retrieval/semantic-search.js --json --mode hybrid --top-k 3 "openclaw blackboard portable task"
          $result = $json | ConvertFrom-Json
          if ($result.entryCount -lt 1) {
            throw 'hybrid retrieval returned no indexed entries'
          }

      - name: Run semantic-search wrapper unit tests
        if: false  # Requires embeddings
        shell: pwsh
        run: |
          node --test ./retrieval/semantic-search-cli.test.js

      - name: Run OpenClaw routed retrieval smoke
        if: false  # Requires embeddings
        shell: pwsh
        env:
          AI_MEMORY_STORE: ${{ runner.temp }}/vault-smoke/00-System/ai-memory
        run: |
          $json = node ./retrieval/semantic-search.js --json --mode hybrid --route task --tool openclaw --source-kind blackboard --top-k 3 "shrimp intel queue"
          $result = $json | ConvertFrom-Json
          if ($result.results.Count -lt 1) {
            throw 'OpenClaw routed retrieval returned no results'
          }
          if ($result.results[0].tool -ne 'openclaw') {
            throw 'OpenClaw routed retrieval did not keep the tool filter'
          }
          if ($result.results[0].sourceKind -ne 'blackboard') {
            throw 'OpenClaw routed retrieval did not keep the source-kind filter'
          }
          if ($result.queryRoute.intent -ne 'task') {
            throw 'OpenClaw routed retrieval did not resolve to task intent'
          }

      - name: Portable install wrapper smoke
        shell: bash
        env:
          AI_MEMORY_STORE: ${{ runner.temp }}/vault-smoke/00-System/ai-memory
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export AI_MEMORY_PWSH="powershell.exe"
          else
            export AI_MEMORY_PWSH="pwsh"
          fi
          TARGET_ROOT="${{ runner.temp }}/ai-memory-smoke"
          ./scripts/install.sh -TargetRoot "$TARGET_ROOT" -RegisterStartup false -PersistUserEnvironment false
          python3 -c 'import os; from pathlib import Path; target = Path(os.environ["TARGET_ROOT"]); expected = ["memory-bus.ps1", "memory-bus.sh", "memory-watchdog.ps1", "memory-watchdog.sh", "verify-client-integrations.ps1", "verify-client-integrations.sh", "run-pressure-test.ps1", "run-pressure-test.sh", "run-memory-dream.sh", "runtime-config.js", "runtime_support.py", "install-manifest.json", "config/runtime.json", "shared-mcp/start-default-shared-mcp.sh", "shared-mcp/start-default-shared-mcp.ps1"]; missing = [p for p in expected if not (target / p).exists()]; os.name != "nt" and [os.chmod(target / exe, 0o755) for exe in ["shared-mcp/start-default-shared-mcp.sh", "run-pressure-test.sh"]]; missing and __import__("sys").exit("Missing: " + ", ".join(missing))'

      - name: Portable shared MCP wrapper smoke
        shell: bash
        env:
          AI_MEMORY_STORE: ${{ runner.temp }}/vault-smoke/00-System/ai-memory
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export AI_MEMORY_PWSH="powershell.exe"
          else
            export AI_MEMORY_PWSH="pwsh"
          fi
          TARGET_ROOT="${{ runner.temp }}/ai-memory-smoke"
          export AI_MEMORY_ROOT="$TARGET_ROOT"
          "$TARGET_ROOT/shared-mcp/start-default-shared-mcp.sh"
          "$TARGET_ROOT/shared-mcp/status-shared-mcp.sh" > "${{ runner.temp }}/shared-status.json"
          python3 -c 'import json; from pathlib import Path; status = json.loads(Path("${{ runner.temp }}").joinpath("shared-status.json").read_text()); required = {"context7", "fetch", "time", "sequential-thinking", "obsidian", "memory"}; running = {i.get("id") for i in status if i.get("running")}; missing = sorted(required - running); missing and __import__("sys").exit("MCP not running: " + ", ".join(missing))'

      - name: Portable shared MCP wrapper shutdown
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export AI_MEMORY_PWSH="powershell.exe"
          else
            export AI_MEMORY_PWSH="pwsh"
          fi
          TARGET_ROOT="${{ runner.temp }}/ai-memory-smoke"
          if [ -f "$TARGET_ROOT/shared-mcp/stop-shared-mcp.sh" ]; then
            bash "$TARGET_ROOT/shared-mcp/stop-shared-mcp.sh"
          fi
