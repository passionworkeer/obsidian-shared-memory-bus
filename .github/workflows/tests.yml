name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # JavaScript unit tests (Node.js)
  # ---------------------------------------------------------------------------
  js-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run JS unit tests
        run: node --test tests/unit/js/*.test.js

  # ---------------------------------------------------------------------------
  # Python unit tests
  # ---------------------------------------------------------------------------
  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Set vault env
        run: echo "AI_MEMORY_STORE=$RUNNER_TEMP/memory-store" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create smoke vault
        run: mkdir -p "$AI_MEMORY_STORE"
        shell: bash

      - name: Install pytest
        run: pip install pytest>=8.0.0

      - name: Run Python unit tests
        run: pytest tests/unit/py/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Cross-language equivalence tests (Linux)
  # ---------------------------------------------------------------------------
  cross-language-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Set vault env
        run: echo "AI_MEMORY_STORE=$RUNNER_TEMP/memory-store" >> $GITHUB_ENV

      - name: Create smoke vault
        run: mkdir -p "$AI_MEMORY_STORE"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest>=8.0.0

      - name: Run cross-language tests
        run: node --test tests/cross-language/*.test.js

  # ---------------------------------------------------------------------------
  # Integration tests (Node.js ESM)
  # ---------------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: |
          echo "PWD: $(pwd)"
          ls tests/integration/js/
          node --test tests/integration/js/*.test.js tests/integration/js/*.test.mjs

  # ---------------------------------------------------------------------------
  # Windows: JS unit tests + Python unit tests
  # ---------------------------------------------------------------------------
  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Set vault env
        run: Add-Content -Path $env:GITHUB_ENV -Value "AI_MEMORY_STORE=$env:RUNNER_TEMP\memory-store"
        shell: pwsh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install npm dependencies
        run: npm ci

      - name: Create smoke vault
        run: New-Item -ItemType Directory -Force -Path "$env:AI_MEMORY_STORE" | Out-Null
        shell: pwsh

      - name: Install pytest
        run: pip install pytest>=8.0.0

      - name: Run JS unit tests
        run: node --test tests/unit/js/*.test.js
        shell: bash

      - name: Run Python unit tests
        run: pytest tests/unit/py/ -v --tb=short

      - name: Run integration tests
        run: node --test tests/integration/js/*.test.js tests/integration/js/*.test.mjs
        shell: bash

      - name: Run inbox-atomic-write concurrent test
        shell: bash
        run: |
          node --test --test-concurrency=4 tests/unit/js/inbox-atomic-write.test.js
