name: Diagnose Security Patch Payload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Inspect payload parts
        shell: bash
        run: |
          set -u
          wc -c .github/security-patch/part-*
          sha256sum .github/security-patch/part-*
          cat .github/security-patch/part-* > "$RUNNER_TEMP/security.patch.gz.b64"
          wc -c "$RUNNER_TEMP/security.patch.gz.b64"
          sha256sum "$RUNNER_TEMP/security.patch.gz.b64"
