name: Export Source Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/source-snapshot.tgz" .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: ${{ runner.temp }}/source-snapshot.tgz
          if-no-files-found: error
