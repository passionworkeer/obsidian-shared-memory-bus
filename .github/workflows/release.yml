name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${package_version}" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install "pytest>=8.0.0"

      - name: Run lint
        run: npm run lint

      - name: Run JavaScript unit tests
        run: npm test

      - name: Run concurrent write tests
        run: npm run test:concurrent

      - name: Run integration tests
        run: npm run test:integration

      - name: Run cross-language tests
        run: npm run test:cross

      - name: Run Python unit tests
        run: pytest tests/unit/py/ -v --tb=short

      - name: Build npm package artifact
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: yt-memory-bus-*.tgz
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
