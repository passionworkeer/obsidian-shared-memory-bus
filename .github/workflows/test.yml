name: Test

on:
  push:
    branches: [main, codex/**]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests — Linux (Node.js 18, 20, 22)
  # ---------------------------------------------------------------------------
  js-unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run JS unit tests
        run: node --test tests/unit/js/*.test.{js,mjs}

  # ---------------------------------------------------------------------------
  # Unit tests — macOS (Node.js 20)
  # ---------------------------------------------------------------------------
  js-unit-tests-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run JS unit tests
        run: node --test tests/unit/js/*.test.{js,mjs}

  # ---------------------------------------------------------------------------
  # Unit tests — Windows (Node.js 20)
  # ---------------------------------------------------------------------------
  js-unit-tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run JS unit tests
        run: node --test tests/unit/js/*.test.{js,mjs}
        shell: bash

  # ---------------------------------------------------------------------------
  # Python unit tests (Linux)
  # ---------------------------------------------------------------------------
  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Set vault env
        run: echo "AI_MEMORY_OBSIDIAN_VAULT=$RUNNER_TEMP/vault-smoke" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create smoke vault
        run: mkdir -p "$AI_MEMORY_OBSIDIAN_VAULT"
        shell: bash

      - name: Install pytest
        run: pip install pytest>=8.0.0

      - name: Run Python unit tests
        run: pytest tests/unit/py/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Cross-language equivalence tests (Linux)
  # ---------------------------------------------------------------------------
  cross-language-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Set vault env
        run: echo "AI_MEMORY_OBSIDIAN_VAULT=$RUNNER_TEMP/vault-smoke" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create smoke vault
        run: mkdir -p "$AI_MEMORY_OBSIDIAN_VAULT"
        shell: bash

      - name: Install dependencies
        run: npm ci && pip install pytest>=8.0.0

      - name: Run cross-language tests
        run: node --test tests/cross-language/*.test.js

  # ---------------------------------------------------------------------------
  # Integration tests (Node.js ESM, Linux)
  # ---------------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: node --test tests/integration/js/*.test.{js,mjs}

  # ---------------------------------------------------------------------------
  # Cross-platform smoke test (Node.js platform detection)
  # ---------------------------------------------------------------------------
  cross-platform-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Platform smoke test
        run: node -e "import('./bus/platform/index.js').then(m => console.log('Platform:', m.platform.name, '| Path sep:', m.platform.pathSep))"

  # ---------------------------------------------------------------------------
  # Lint (Linux only)
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
