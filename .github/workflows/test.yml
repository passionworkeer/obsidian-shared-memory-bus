name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'codex/**'
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Immutable GitHub Action references
        run: node scripts/check-action-pins.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generated service artifacts
        run: npm run check:services
      - name: ESLint
        run: npm run lint
      - name: Shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -q 'bash'; then
              bash -n "$file"
            else
              sh -n "$file"
            fi
          done < <(find shared-mcp scripts -type f -name '*.sh' -print0)

  js-unit:
    name: JS unit (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:concurrent

  python-unit:
    name: Python unit
    runs-on: ubuntu-latest
    env:
      AI_MEMORY_STORE: ${{ github.workspace }}/.tmp/memory-store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Create memory store
        run: mkdir -p "$AI_MEMORY_STORE"
      - name: Install test dependencies
        run: python -m pip install "pytest>=8.0.0"
      - name: Run isolated Python tests
        run: AI_MEMORY_PY_METRICS_PORT=0 pytest tests/unit/py/ -v --tb=short --ignore=tests/unit/py/test_metrics_exporter.py
      - name: Run metrics exporter tests on the documented default port
        run: pytest tests/unit/py/test_metrics_exporter.py -v --tb=short

  cross-language:
    name: Cross-language equivalence
    runs-on: ubuntu-latest
    env:
      AI_MEMORY_STORE: ${{ github.workspace }}/.tmp/memory-store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: mkdir -p "$AI_MEMORY_STORE"
      - run: npm ci
      - run: python -m pip install "pytest>=8.0.0"
      - name: Run cross-language tests
        run: PYTHONPATH="$GITHUB_WORKSPACE/retrieval" npm run test:cross

  integration:
    name: Integration
    runs-on: ubuntu-latest
    env:
      AI_MEMORY_STORE: ${{ github.workspace }}/.tmp/memory-store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p "$AI_MEMORY_STORE"
      - run: npm ci
      - run: npm run test:integration

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Platform module smoke test
        run: node -e "import('./bus/platform/index.js').then(m => console.log('Platform:', m.platform.name, '| Path sep:', m.platform.pathSep))"
      - name: Unit smoke test
        run: node --test tests/unit/js/spawn-plan.test.js
        shell: bash

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Verify CLI entry point
        run: node bin.js --version
