name: CI

on:
  push:
    branches: [main, agent/**, codex/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Shell syntax
        run: |
          find shared-mcp scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  js-unit:
    name: JS unit (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19', '22']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:concurrent

  python-unit:
    name: Python unit
    runs-on: ubuntu-latest
    env:
      AI_MEMORY_STORE: ${{ runner.temp }}/memory-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Create memory store
        run: mkdir -p "$AI_MEMORY_STORE"
      - name: Install test dependencies
        run: python -m pip install "pytest>=8.0.0"
      - name: Run Python tests
        run: pytest tests/unit/py/ -v --tb=short

  cross-language:
    name: Cross-language equivalence
    runs-on: ubuntu-latest
    env:
      AI_MEMORY_STORE: ${{ runner.temp }}/memory-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: mkdir -p "$AI_MEMORY_STORE"
      - run: npm ci
      - run: python -m pip install "pytest>=8.0.0"
      - run: npm run test:cross

  integration:
    name: Integration
    runs-on: ubuntu-latest
    env:
      AI_MEMORY_STORE: ${{ runner.temp }}/memory-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p "$AI_MEMORY_STORE"
      - run: npm ci
      - run: npm run test:integration

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Platform module smoke test
        run: node -e "import('./bus/platform/index.js').then(m => console.log('Platform:', m.platform.name, '| Path sep:', m.platform.pathSep))"
      - name: Unit smoke test
        run: node --test tests/unit/js/spawn-plan.test.js
        shell: bash

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Verify CLI entry point
        run: node bin.js --version
