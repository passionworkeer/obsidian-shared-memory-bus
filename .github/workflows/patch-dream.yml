name: Patch dream StrictMode regression

on:
  push:
    branches:
      - agent/fix-ci-baseline
    paths:
      - .github/workflows/patch-dream.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-ci-baseline
          fetch-depth: 0

      - name: Replace the unsafe promotion property lookup
        shell: python
        run: |
          from pathlib import Path

          target = Path('ops/run/run-memory-dream.ps1')
          original = '''function Get-RecordPromotionMetadata {
              param([Parameter(Mandatory = $true)][object]$Record)

              if ($null -ne $Record.metadata -and $Record.metadata.PSObject.Properties.Name -contains "promotion") {
                  return $Record.metadata.promotion
              }

              return $null
          }'''
          replacement = '''function Get-RecordPromotionMetadata {
              param([Parameter(Mandatory = $true)][object]$Record)

              if ($null -eq $Record.metadata) {
                  return $null
              }

              $promotionProperty = $Record.metadata.PSObject.Properties["promotion"]
              if ($null -ne $promotionProperty) {
                  return $promotionProperty.Value
              }

              return $null
          }'''

          content = target.read_text(encoding='utf-8-sig')
          count = content.count(original)
          if count != 1:
              raise SystemExit(f'expected one exact function match, found {count}')
          target.write_text(content.replace(original, replacement), encoding='utf-8')

      - name: Parse PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'ops/run/run-memory-dream.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Commit the focused patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/run/run-memory-dream.ps1
          git commit -m 'fix dream promotion metadata lookup under StrictMode'
          git push origin HEAD:agent/fix-ci-baseline
