services:
  memory-bus:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-memory-bus:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:9332:9332"
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:9338:9338"
      - "127.0.0.1:9339:9339"
      - "127.0.0.1:9340:9340"
      - "127.0.0.1:9341:9341"
    volumes:
      - ai-memory-store:/data
    environment:
      AI_MEMORY_ROOT: /app
      AI_MEMORY_STORE: /data
      AI_MEMORY_PYTHON: /opt/yt-venv/bin/python
      AI_MEMORY_EMBED_BACKEND: hash
      AI_MEMORY_SERVER_MODE: split
      AI_MEMORY_BIND_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9338/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ai-memory-store:
