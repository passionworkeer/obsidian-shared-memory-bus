<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Install join remember</title>
  <desc id="desc">Bilingual setup card for Local AI Memory Bus.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="62" font-weight="800" fill="#101828">三步接入共享记忆</text>
  <text x="100" y="168" font-family="Arial, sans-serif" font-size="30" fill="#475467">Install. Join. Remember.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(130 280)">
      <circle cx="120" cy="70" r="58" fill="#e0f2fe"/>
      <text x="120" y="86" text-anchor="middle" font-size="48" font-weight="800" fill="#026aa2">1</text>
      <text x="120" y="180" text-anchor="middle" font-size="36" font-weight="800" fill="#101828">安装</text>
      <text x="120" y="220" text-anchor="middle" font-size="24" fill="#475467">Install runtime</text>
      <text x="120" y="285" text-anchor="middle" font-size="22" fill="#667085">运行 install 脚本</text>
      <text x="120" y="318" text-anchor="middle" font-size="18" fill="#98a2b3">Run the install script</text>
    </g>
    <g transform="translate(640 280)">
      <circle cx="120" cy="70" r="58" fill="#dcfae6"/>
      <text x="120" y="86" text-anchor="middle" font-size="48" font-weight="800" fill="#067647">2</text>
      <text x="120" y="180" text-anchor="middle" font-size="36" font-weight="800" fill="#101828">加入</text>
      <text x="120" y="220" text-anchor="middle" font-size="24" fill="#475467">Join from agents</text>
      <text x="120" y="285" text-anchor="middle" font-size="22" fill="#667085">读取 SKILL.md</text>
      <text x="120" y="318" text-anchor="middle" font-size="18" fill="#98a2b3">Read the agent pack</text>
    </g>
    <g transform="translate(1150 280)">
      <circle cx="120" cy="70" r="58" fill="#fef0c7"/>
      <text x="120" y="86" text-anchor="middle" font-size="48" font-weight="800" fill="#b54708">3</text>
      <text x="120" y="180" text-anchor="middle" font-size="36" font-weight="800" fill="#101828">记住</text>
      <text x="120" y="220" text-anchor="middle" font-size="24" fill="#475467">Shared recall</text>
      <text x="120" y="285" text-anchor="middle" font-size="22" fill="#667085">跨工具检索和交接</text>
      <text x="120" y="318" text-anchor="middle" font-size="18" fill="#98a2b3">Search and hand off</text>
    </g>
  </g>
  <text x="800" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#101828">Local AI Memory Bus</text>
  <text x="800" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#667085">本地优先 · 多工具共享 · 可复制的 Agent Pack</text>
</svg>
